[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eilik-sdk"
version = "0.1.0"
description = "Reusable Python SDK and controller service for Eilik over USB serial."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
eilik = "eilik.cli:main"

[tool.setuptools.packages.find]
include = ["eilik*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
